%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/wm,wm8505-pmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: WonderMedia WM8505 Clock Controller (PMC)

maintainers:
  - Logan Russell <me@lrussell.net>

properties:
  compatible:
    const: wm,wm8505-pmc

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Main 24 MHz oscillator
      - description: Main 25 MHz oscillator

  clock-names:
    items:
      - const: osc24m
      - const: osc25m

  "#clock-cells":
    const: 1
    description: The clock index matching the constants in <dt-bindings/clock/wm8505-clock.h>

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    clock-controller@d8130000 {
        compatible = "wm,wm8505-pmc";
        reg = <0xd8130000 0x1000>;
        #clock-cells = <1>;
        clocks = <&osc24m>, <&osc25m>;
        clock-names = "osc24m", "osc25m";
    };
