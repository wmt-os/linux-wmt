%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/wm,wm8505-sf.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: WonderMedia Serial Flash Controller (SFC)

maintainers:
  - Logan Russell <me@lrussell.net>

allOf:
  - $ref: mtd.yaml#

properties:
  compatible:
    const: wm,wm8505-sf

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/wm8505-clock.h>

    flash@d800c000 {
        compatible = "wm,wm8505-sf";
        reg = <0xd800c000 0x400>;
        clocks = <&pmc WM8505_CLK_SFC>;

        partitions {
            compatible = "fixed-partitions";
            #address-cells = <1>;
            #size-cells = <1>;

            partition@0 {
                label = "u-boot";
                reg = <0x0 0x80000>;
            };
        };
    };
