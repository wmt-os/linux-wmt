%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/wm,wm8505-battery.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: WonderMedia WM8505 Battery Monitor

maintainers:
  - Logan Russell <me@lrussell.net>

description:
  The WM8505 netbook has no ADC and measures its battery voltage by timing
  how long an RC network charged from the battery rail takes to pull a GPIO
  past its input threshold.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: wm,wm8505-battery

  sense-gpios:
    maxItems: 1
    description: GPIO wired to the RC measurement network

  charge-done-gpios:
    maxItems: 1
    description:
      GPIO driven by the on-board charging circuit to report charge
      completion. The completed level varies across the population.

  low-battery-gpios:
    maxItems: 1
    description: GPIO asserted by the low-voltage comparator

  revision-gpios:
    maxItems: 1
    description:
      Unused pad strapped per charging-circuit revision, high where the
      charge-done output completes at 0 and low where it completes at 1

  wm,threshold-microvolt:
    minimum: 1
    description:
      Input threshold of the sense GPIO, referred to the battery rail by the
      on-board resistor divider

  wm,alarm-microvolt:
    description:
      Battery voltage at which the low-voltage comparator trips, one cell per
      charging-circuit revision
    items:
      - description: Trip voltage where charge-done reads 0 when complete
      - description: Trip voltage where charge-done reads 1 when complete

  monitored-battery: true

required:
  - compatible
  - sense-gpios
  - charge-done-gpios
  - low-battery-gpios
  - revision-gpios
  - wm,threshold-microvolt
  - wm,alarm-microvolt
  - monitored-battery
  - power-supplies

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    battery-monitor {
        compatible = "wm,wm8505-battery";
        sense-gpios = <&pinctrl 4 GPIO_ACTIVE_HIGH>;
        charge-done-gpios = <&pinctrl 1 GPIO_ACTIVE_HIGH>;
        low-battery-gpios = <&pinctrl 259 GPIO_ACTIVE_LOW>;
        revision-gpios = <&pinctrl 19 GPIO_ACTIVE_HIGH>;
        monitored-battery = <&battery>;
        power-supplies = <&charger>;
        wm,threshold-microvolt = <4000000>;
        wm,alarm-microvolt = <6870000 6780000>;
    };
